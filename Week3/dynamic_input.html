<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CiviVote Kenya | Dynamic Input</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="split-container">

    <div class="circle1"></div>
    <div class="circle2"></div>

    <!-- Left Section -->

    <div class="form-section">

        <h1>CiviVote Kenya</h1>

        <div class="subtitle">

            Live Voter Information Preview

        </div>

        <label for="nameInput">Full Name</label>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter Full Name"
            onkeyup="updatePreview()"
        >

        <label for="idInput">ID Number</label>

        <input
            type="text"
            id="idInput"
            placeholder="Enter ID Number"
            onkeyup="updatePreview()"
        >

        <label for="countyInput">County</label>

        <input
            type="text"
            id="countyInput"
            placeholder="Enter County"
            onkeyup="updatePreview()"
        >

    </div>

    <!-- Right Section -->

    <div class="preview-section">

        <div class="preview-title">

            Live Preview

        </div>

        <div class="profile" id="profileLetter">

            V

        </div>

        <div class="info">

            <div class="info-title">

                Voter Name

            </div>

            <div class="info-value" id="previewName">

                No Name Entered

            </div>

        </div>

        <div class="info">

            <div class="info-title">

                ID Number

            </div>

            <div class="info-value" id="previewID">

                No ID Number

            </div>

        </div>

        <div class="info">

            <div class="info-title">

                County

            </div>

            <div class="info-value" id="previewCounty">

                No County Selected

            </div>

        </div>

        <div class="footer">

            © <span id="currentYear"></span> CiviVote Kenya. All Rights Reserved.

        </div>

    </div>

</div>

<script>

function updatePreview(){

    let name = document.getElementById("nameInput").value;
    let id = document.getElementById("idInput").value;
    let county = document.getElementById("countyInput").value;

    document.getElementById("previewName").textContent =
        name || "No Name Entered";

    document.getElementById("previewID").textContent =
        id || "No ID Number";

    document.getElementById("previewCounty").textContent =
        county || "No County Selected";

    if(name.length > 0){

        document.getElementById("profileLetter").textContent =
            name.charAt(0).toUpperCase();

    }

    else{

        document.getElementById("profileLetter").textContent = "V";

    }

}

document.getElementById("currentYear").textContent =
new Date().getFullYear();

</script>

<script src="script.js"></script>

</body>

</html>
